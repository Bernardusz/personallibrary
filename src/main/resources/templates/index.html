<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Personal Library</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<h1>My Library</h1>

<form th:action="@{/search}" method="get" class="row g-2 mb-4">
    <div class="col-md-10">
        <input type="text" name="title" class="form-control" placeholder="Title">
    </div>
    <div class="col-md-2">
        <button type="submit" class="btn btn-primary">Search</button>
    </div>
</form>

<form th:action="@{/add}" method="post" class="row g-3 mb-4">
    <div class="col-md-4">
        <input type="text" name="title" class="form-control" placeholder="Title" required>
    </div>
    <div class="col-md-3">
        <input type="text" name="author" class="form-control" placeholder="Author" required>
    </div>
    <div class="col-md-3">
        <input type="text" name="isbn" class="form-control" placeholder="ISBN">
    </div>
    <div class="col-md-2">
        <button type="submit" class="btn btn-primary">Add Book</button>
    </div>
</form>

<table class="table table-striped">
    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>ISBN</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}"></td>
        <td th:text="${book.title}"></td>
        <td th:text="${book.author}"></td>
        <td th:text="${book.isbn}"></td>
        <td>
            <div class="d-flex gap-2">
                <a th:href="@{/edit/{id}(id=${book.id})}" class="btn btn-warning btn-sm">Edit</a>
                <form th:action="@{/delete/{id}(id=${book.id})}" method="post" onsubmit="return confirm('Are you sure?')">
                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                </form>
            </div>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
