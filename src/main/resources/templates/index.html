<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Personal Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h1>My Library</h1>

<form class="row g-2 mb-4" method="get" th:action="@{/search}">
    <div class="col-md-10">
        <input class="form-control" name="title" placeholder="Title" type="text">
    </div>
    <div class="col-md-2">
        <button class="btn btn-primary" type="submit">Search</button>
    </div>
</form>

<form class="row g-3 mb-4" method="post" th:action="@{/add}">
    <div class="col-md-4">
        <input class="form-control" name="title" placeholder="Title" required type="text">
    </div>
    <div class="col-md-3">
        <input class="form-control" name="author" placeholder="Author" required type="text">
    </div>
    <div class="col-md-3">
        <input class="form-control" name="isbn" placeholder="ISBN" type="text">
    </div>
    <div class="col-md-2">
        <button class="btn btn-primary" type="submit">Add Book</button>
    </div>
</form>

<table class="table table-striped">
    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>ISBN</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}"></td>
        <td th:text="${book.title}"></td>
        <td th:text="${book.author}"></td>
        <td th:text="${book.isbn}"></td>
        <td>
            <div class="d-flex gap-2">
                <a class="btn btn-warning btn-sm" th:href="@{/edit/{id}(id=${book.id})}">Edit</a>
                <form method="post" onsubmit="return confirm('Are you sure?')"
                      th:action="@{/delete/{id}(id=${book.id})}">
                    <button class="btn btn-danger btn-sm" type="submit">Delete</button>
                </form>
            </div>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
