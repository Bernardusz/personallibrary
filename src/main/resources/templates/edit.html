<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Book - Personal Library</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<h1>Edit Book</h1>

<form th:action="@{/update}" th:object="${book}" method="post" class="row g-3 mb-4">
    <!-- Hidden field for the ID -->
    <input type="hidden" th:field="*{id}">

    <div class="col-md-4">
        <label class="form-label">Title</label>
        <input type="text" th:field="*{title}" class="form-control" required>
    </div>
    <div class="col-md-3">
        <label class="form-label">Author</label>
        <input type="text" th:field="*{author}" class="form-control" required>
    </div>
    <div class="col-md-3">
        <label class="form-label">ISBN</label>
        <input type="text" th:field="*{isbn}" class="form-control">
    </div>
    <div class="col-md-2 d-flex align-items-end">
        <button type="submit" class="btn btn-success">Save Changes</button>
        <a th:href="@{/}" class="btn btn-secondary ms-2">Cancel</a>
    </div>
</form>

</body>
</html>
