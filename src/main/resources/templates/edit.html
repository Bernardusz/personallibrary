<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Book - Personal Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h1>Edit Book</h1>

<form class="row g-3 mb-4" method="post" th:action="@{/update}" th:object="${book}">
    <!-- Hidden field for the ID -->
    <input th:field="*{id}" type="hidden">

    <div class="col-md-4">
        <label class="form-label">Title</label>
        <input class="form-control" required th:field="*{title}" type="text">
    </div>
    <div class="col-md-3">
        <label class="form-label">Author</label>
        <input class="form-control" required th:field="*{author}" type="text">
    </div>
    <div class="col-md-3">
        <label class="form-label">ISBN</label>
        <input class="form-control" th:field="*{isbn}" type="text">
    </div>
    <div class="col-md-2 d-flex align-items-end">
        <button class="btn btn-success" type="submit">Save Changes</button>
        <a class="btn btn-secondary ms-2" th:href="@{/}">Cancel</a>
    </div>
</form>

</body>
</html>
